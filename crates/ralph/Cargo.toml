[package]
name = "ralph"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ralph"
path = "src/main.rs"

[dependencies]
ralph-common = { path = "../ralph-common" }
ralph-config = { path = "../ralph-config" }
ralph-worker = { path = "../ralph-worker" }
ralph-pipeline = { path = "../ralph-pipeline" }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true

[[test]]
name = "workspace_structure"
path = "../../tests/workspace_structure.rs"

[[test]]
name = "cli"
path = "../../tests/cli/mod.rs"

[[test]]
name = "worker_integration"
path = "../../tests/worker/mod.rs"

[[test]]
name = "config_integration"
path = "../../tests/config_integration.rs"

[[test]]
name = "pipeline_integration"
path = "../../tests/pipeline_integration.rs"

[dev-dependencies]
rstest.workspace = true
rstest_reuse.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
toml.workspace = true
serde_json.workspace = true
ralph-worker = { path = "../ralph-worker" }
ralph-config = { path = "../ralph-config" }
ralph-pipeline = { path = "../ralph-pipeline" }
tokio = { workspace = true, features = ["test-util"] }
