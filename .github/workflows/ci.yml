# BMad TEA CI pipeline — Python quality gates for bmad-ralph
# Stack: Python CLI backend
# Burn-in: skipped (backend-only; targets UI flakiness per TEA guidance)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Run Python test suite
        run: make test-all

      - name: Summary
        run: |
          {
            echo "## CI Quality Gate"
            echo ""
            echo "Python tests passed."
          } >> "$GITHUB_STEP_SUMMARY"
