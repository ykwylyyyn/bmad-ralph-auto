# BMad TEA CI pipeline — Python + Rust quality gates for bmad-ralph
# Stack: backend (Python CLI + legacy Rust workspace)
# Burn-in: skipped (backend-only; targets UI flakiness per TEA guidance)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Run Python test suite
        run: make test-all

  rust:
    name: Rust Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [python, rust]
    if: always()

    steps:
      - name: Require all checks to pass
        run: |
          if [ "${{ needs.python.result }}" != "success" ] || [ "${{ needs.rust.result }}" != "success" ]; then
            echo "Quality gate failed."
            echo "  python: ${{ needs.python.result }}"
            echo "  rust:   ${{ needs.rust.result }}"
            exit 1
          fi
          echo "Quality gate passed."

      - name: Summary
        run: |
          {
            echo "## CI Quality Gate"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Python Tests | ${{ needs.python.result }} |"
            echo "| Rust Quality Gate | ${{ needs.rust.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
