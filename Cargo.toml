[workspace]
resolver = "3"
members = [
    "crates/ralph",
    "crates/ralph-common",
    "crates/ralph-config",
    "crates/ralph-worker",
    "crates/ralph-pipeline",
    "tests/fake-claude",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# --- Runtime dependencies ---
async-trait = "0.1"
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
indicatif = "0.18"
rusqlite = { version = "0.38", features = ["bundled"] }

# --- Dev/Test dependencies (workspace-wide) ---
rstest = "0.26"
rstest_reuse = "0.7"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
mockall = "0.14"
wiremock = "0.6"
